name: spark_ide
description: "Spark IDE - A lightweight, cross-platform code editor."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  phosphor_flutter: ^2.1.0

  # File system
  file_picker: ^8.1.7
  path: ^1.9.1
  path_provider: ^2.1.5

  # Storage
  shared_preferences: ^2.3.5

  # Utilities
  uuid: ^4.5.1
  collection: ^1.19.1
  equatable: ^2.0.7

  # Terminal
  xterm: ^4.0.0
  flutter_pty: ^0.4.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/themes/
    - assets/icons/
    - assets/icons/files/
    - assets/icons/folders/

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
